<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Toggle button for the side panel -->
  <button id="panelToggle" aria-label="Toggle conversation panel">
    <span class="toggleBar"></span>
    <span class="toggleBar"></span>
    <span class="toggleBar"></span>
  </button>

  <!-- Side panel: chat log + text fallback -->
  <aside id="sidePanel" class="closed">
    <div class="panelHeader">
      <span>CONVERSATION</span>
    </div>

    <div id="chatLog"></div>

    <form id="textForm" autocomplete="off">
      <input type="text" id="textInput" placeholder="Type to Jarvis…" />
      <button type="submit" id="sendBtn" aria-label="Send">↵</button>
    </form>
  </aside>

  <!-- Main stage: the orb -->
  <main id="stage">
    <div id="orbWrap">
      <div id="orb">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="ring ring3"></div>
        <div class="core"></div>
      </div>
      <button id="micBtn" aria-label="Toggle voice input">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <p id="statusLine">Standing by</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
